<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Product details at Muuko's Emporium.">
	<title>Product Details | Muuko's Emporium</title>
	<link rel="icon" type="image/png" href="../media/muukosemporiumlogo.png">
	<link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
	<header class="site-header">
		<nav class="navbar navbar-expand-lg navbar-dark site-navbar" aria-label="Main navigation">
			<div class="container">
				<a class="navbar-brand brand-lockup" href="../index.html" aria-label="Muuko's Emporium home">
					<img class="brand-mark" src="../media/muukosemporiumlogo.png" alt="Muuko's Emporium logo">
					<span class="brand-name">MUUKO'S <span>EMPORIUM</span></span>
				</a>
				<button class="navbar-toggler" type="button" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
				<div class="collapse navbar-collapse" id="mainNavigation">
					<ul class="navbar-nav ml-auto align-items-lg-center">
						<li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
						<li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
						<li class="nav-item active"><a class="nav-link" href="products.html" aria-current="page">Products</a></li>
						<li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
						<li class="nav-item ml-lg-3"><button class="cart-button" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" aria-controls="cartOffcanvas" aria-label="Shopping cart, 0 items"><span class="cart-icon" aria-hidden="true">&#128722;</span><span>Cart</span><span class="cart-count" aria-hidden="true">0</span></button></li>
					</ul>
				</div>
			</div>
		</nav>
	</header>
	<main>
		<section class="product-details-section section-padding">
			<div class="container" id="product-details" aria-live="polite">
				<p class="loading-message">Loading product...</p>
			</div>
		</section>
	</main>
	<footer class="site-footer">
		<div class="container">
			<div class="row align-items-center">
				<div class="col-md-5 mb-4 mb-md-0"><p class="footer-brand">MUUKO'S EMPORIUM</p><p class="footer-tagline">Find your sound. Make it yours.</p></div>
				<div class="col-md-7"><nav class="footer-nav" aria-label="Footer navigation"><a href="../index.html">Home</a><a href="products.html">Products</a><a href="about.html">About Us</a><a href="contact.html">Contact Us</a></nav></div>
			</div>
			<div class="footer-bottom"><small>&copy; 2026 Muuko's Emporium. All rights reserved.</small></div>
		</div>
	</footer>

	<div class="offcanvas offcanvas-end cart-offcanvas" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
		<div class="offcanvas-header">
			<h2 class="offcanvas-title" id="cartOffcanvasLabel">YOUR CART</h2>
			<button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
		</div>
		<div class="offcanvas-body cart-offcanvas-body">
			<div id="cart-items" class="cart-items"></div>
			<div id="cart-summary" class="cart-summary"></div>
		</div>
	</div>

	<script src="../js/cart.js"></script>
	<script src="../js/products.js"></script>
	<script src="../js/script.js"></script>
</body>
</html>
